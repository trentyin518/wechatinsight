# Nginx vhost for hosts outside mainland China (no ICP filing, no 8443 hack).
# Install as /etc/nginx/conf.d/wechat-api.conf.

upstream wechatinsight_api { server 127.0.0.1:8000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name api.wechatinsight.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wechatinsight.com;

    ssl_certificate     /etc/letsencrypt/live/api.wechatinsight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wechatinsight.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://wechatinsight_api;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://wechatinsight_api;
        proxy_next_upstream error timeout http_502;
    }
}
